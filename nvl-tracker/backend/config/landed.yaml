# =============================================================================
# Giả định quy đổi LANDED COST + AT-SIGHT TƯƠNG ĐƯƠNG (engine analytics/landed.py)
# Chỉnh theo thực tế nhập khẩu của doanh nghiệp.
# =============================================================================

# Lãi vốn/năm (dùng tính lợi ích trả chậm = usance benefit)
interest_pct_year: 0.065

# Thuế nhập khẩu theo nhóm NVL (khóa duty_key trong materials.yaml)
duty_pct:
  pp: 0.03         # PP
  pe: 0.02         # PE/HDPE — bảo hộ Long Sơn (LSP)
  ps: 0.03
  tio2: 0.06
  stearic: 0.05
  additive: 0.03   # phụ gia khác (ước lượng)

# Cước + bảo hiểm (%) và phí nội địa (VND/kg) theo vùng xuất xứ
freight_insurance_pct:
  default: 0.05
  CN: 0.04         # Trung Quốc gần
  SEA: 0.04
  US: 0.08
  ME: 0.07         # Trung Đông

domestic_cost_vnd_kg:
  default: 400     # bốc dỡ + vận chuyển nội địa ước lượng

# Quy ước điều khoản thanh toán → số ngày được nợ (tính usance)
payment_term_days:
  at_sight: 0
  "L/C at sight": 0
  "TT 30": 30
  "TT 60": 60
  "L/C 90": 90
  "L/C 120": 120
